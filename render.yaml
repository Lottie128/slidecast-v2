services:
  - type: web
    name: slidecast-v2
    runtime: node
    plan: free
    region: oregon
    buildCommand: bun install && bun run build:client
    startCommand: bun run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_API_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
