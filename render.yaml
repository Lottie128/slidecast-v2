services:
  - type: web
    name: slidecast-v2
    runtime: node
    env: node
    region: oregon
    plan: free
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health
    autoDeploy: true
